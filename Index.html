<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Salary Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18212f}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{padding:24px 20px 18px;background:#18212f;color:white}
header h1{margin:0 0 5px;font-size:24px}header p{margin:0;color:#cbd5e1}
.nav-controls{display:flex;gap:8px;margin-top:12px}
.nav-controls select{background:#2d3748;color:white;border:1px solid #4a5568}
main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}
.big{font-size:25px;font-weight:700;margin-top:7px}.label{font-size:13px;color:#64748b}
.balance{background:#eef6ff;border-color:#bfdbfe}
.form{margin-top:18px}.form h2{font-size:18px;margin:0 0 12px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;font-size:15px}
button{background:#2563eb;color:white;border:0;font-weight:600;cursor:pointer}
button.secondary{background:#e5e7eb;color:#18212f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.expenses{margin-top:20px}.expense{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}
.expense:last-child{border:0}.cat{font-weight:600}.amt{font-weight:700}
.danger{color:#dc2626}.income{color:#16a34a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.small{font-size:12px;color:#64748b;margin-top:8px}
.empty{text-align:center;color:#64748b;padding:20px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>💰 My Salary Tracker</h1>
<p id="month"></p>
<div class="nav-controls">
  <select id="selectMonth" onchange="changePeriod()"></select>
  <select id="selectYear" onchange="changePeriod()"></select>
</div>
</header>
<main>
<div class="grid">
<div class="card"><div class="label">Monthly Salary</div><div class="big income" id="salary">₹0</div></div>
<div class="card balance"><div class="label">Available Balance</div><div class="big" id="balance">₹0</div></div>
<div class="card"><div class="label">Total Expenses</div><div class="big danger" id="expenses">₹0</div></div>
<div class="card"><div class="label">Savings</div><div class="big income" id="savings">₹0</div></div>
</div>

<section class="form">
<h2>Set monthly salary</h2>
<div class="row">
<input id="salaryInput" type="number" placeholder="Salary ₹">
<button onclick="setSalary()">Save Salary</button>
</div>
</section>

<section class="form">
<h2>Saving goals</h2>
<div class="row">
<input id="houseGoal" type="number" placeholder="House target ₹">
<input id="houseSave" type="number" placeholder="House save ₹">
</div>
<div class="row">
<input id="carGoal" type="number" placeholder="Car target ₹">
<input id="carSave" type="number" placeholder="Car save ₹">
</div>
<div class="row">
<input id="travelGoal" type="number" placeholder="Travel target ₹">
<input id="travelSave" type="number" placeholder="Travel save ₹">
</div>
<div class="row">
<input id="medicalGoal" type="number" placeholder="Medical target ₹">
<input id="medicalSave" type="number" placeholder="Medical save ₹">
</div>
<button onclick="saveGoals()">Save goals</button>
<div id="goalList" class="small" style="margin-top:12px"></div>
</section>

<section class="form">
<h2>Add expense</h2>
<div class="row">
<input id="amount" type="number" placeholder="Amount ₹">
<select id="category">
<option>EMI</option><option>Grocery</option><option>Electricity</option>
<option>Petrol</option><option>Mobile</option><option>Medicine</option>
<option>Gas</option><option>Water</option><option>Other</option>
</select>
</div>
<input id="note" placeholder="Note (optional)" style="margin-bottom:10px">
<button onclick="addExpense()">+ Add Expense</button>
<div class="actions">
<button class="secondary" onclick="clearMonth()">Clear Month</button>
<button class="secondary" onclick="exportCSV()">Export CSV</button>
</div>
</section>

<section class="expenses">
<h2>Expenses</h2>
<div id="list"></div>
</section>
</main>
</div>

<script>
const storageKey = 'salaryTracker_v2';
const now = new Date();
let selectedYear = now.getFullYear();
let selectedMonth = now.getMonth();

let store = JSON.parse(localStorage.getItem(storageKey) || '{}');

function getPeriodKey() {
  return `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
}

function getPeriodData() {
  const pKey = getPeriodKey();
  if (!store[pKey]) {
    store[pKey] = {
      salary: 0,
      expenses: [],
      goals: {
        House: { target: 0, saved: 0 },
        Car: { target: 0, saved: 0 },
        Travel: { target: 0, saved: 0 },
        Medical: { target: 0, saved: 0 }
      }
    };
  }
  return store[pKey];
}

function initDateControls() {
  const monthSelect = document.getElementById('selectMonth');
  const yearSelect = document.getElementById('selectYear');
  
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  monthSelect.innerHTML = months.map((m, i) => `<option value="${i}">${m}</option>`).join('');
  monthSelect.value = selectedMonth;

  let yearOptions = '';
  for (let y = selectedYear - 10; y <= selectedYear + 10; y++) {
    yearOptions += `<option value="${y}">${y}</option>`;
  }
  yearSelect.innerHTML = yearOptions;
  yearSelect.value = selectedYear;
}

function changePeriod() {
  selectedMonth = parseInt(document.getElementById('selectMonth').value);
  selectedYear = parseInt(document.getElementById('selectYear').value);
  render();
}

function money(n){ return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }

function save() {
  localStorage.setItem(storageKey, JSON.stringify(store));
  render();
}

function setSalary() {
  const data = getPeriodData();
  const n = Number(document.getElementById('salaryInput').value);
  if (n >= 0) {
    data.salary = n;
    document.getElementById('salaryInput').value = '';
    save();
  }
}

function saveGoals() {
  const data = getPeriodData();
  const ids = [
    ['House', 'houseGoal', 'houseSave'],
    ['Car', 'carGoal', 'carSave'],
    ['Travel', 'travelGoal', 'travelSave'],
    ['Medical', 'medicalGoal', 'medicalSave']
  ];
  ids.forEach(([name, g, s]) => {
    data.goals[name] = {
      target: Number(document.getElementById(g).value) || 0,
      saved: Number(document.getElementById(s).value) || 0
    };
  });
  save();
}

function addExpense() {
  const data = getPeriodData();
  const amount = Number(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  if (amount <= 0) { alert('Enter a valid amount'); return; }
  
  const formattedDate = new Date(selectedYear, selectedMonth, new Date().getDate()).toLocaleDateString('en-IN');
  data.expenses.unshift({ id: Date.now(), amount, category, note, date: formattedDate });
  
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  save();
}

function del(id) {
  const data = getPeriodData();
  data.expenses = data.expenses.filter(x => x.id !== id);
  save();
}

function clearMonth() {
  if (confirm('Delete all expenses and salary for this selected month?')) {
    const pKey = getPeriodKey();
    delete store[pKey];
    save();
  }
}

function exportCSV() {
  const data = getPeriodData();
  let csv = 'Date,Category,Note,Amount\n' + data.expenses.map(x => `"${x.date}","${x.category}","${x.note.replaceAll('"', '""')}",${x.amount}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `salary-expenses-${getPeriodKey()}.csv`;
  a.click();
}

function render() {
  const data = getPeriodData();
  const total = data.expenses.reduce((s, x) => s + x.amount, 0);

  document.getElementById('salary').textContent = money(data.salary);
  document.getElementById('expenses').textContent = money(total);
  document.getElementById('balance').textContent = money(data.salary - total);
  document.getElementById('savings').textContent = money(Math.max(0, data.salary - total));
  
  document.getElementById('salaryInput').value = data.salary || '';

  const goalInputs = [
    ['House', 'houseGoal', 'houseSave'],
    ['Car', 'carGoal', 'carSave'],
    ['Travel', 'travelGoal', 'travelSave'],
    ['Medical', 'medicalGoal', 'medicalSave']
  ];
  goalInputs.forEach(([name, gId, sId]) => {
    document.getElementById(gId).value = data.goals[name]?.target || '';
    document.getElementById(sId).value = data.goals[name]?.saved || '';
  });

  document.getElementById('goalList').innerHTML = Object.entries(data.goals).map(([name, g]) => {
    const pct = g.target ? Math.min(100, Math.round(g.saved / g.target * 100)) : 0;
    return `<div style="margin-bottom:9px"><b>${name}</b>: ${money(g.saved)} / ${money(g.target)} (${pct}%)\n<progress value="${pct}" max="100" style="width:100%"></progress></div>`;
  }).join('');

  const dateObj = new Date(selectedYear, selectedMonth);
  document.getElementById('month').textContent = dateObj.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

  const list = document.getElementById('list');
  if (!data.expenses.length) {
    list.innerHTML = '<div class="empty">No expenses yet for this month. Add your first expense above.</div>';
    return;
  }
  list.innerHTML = data.expenses.map(x => `
  <div class="expense">
    <div><div class="cat">${x.category}</div><div class="small">${x.note || 'No note'} · ${x.date}</div></div>
    <div style="text-align:right"><div class="amt">${money(x.amount)}</div>
    <button onclick="del(${x.id})" style="margin-top:5px;width:auto;padding:5px 9px;background:#fee2e2;color:#991b1b">Delete</button></div>
  </div>`).join('');
}

initDateControls();
render();
</script>
</body>
</html>
